<main><h1>#1213 界面预览</h1><p class="m">commit 7fbd1b3 · <a href="https://github.com/yetone/magpie/pull/1213">回到 PR</a> · 改动只在 app.js 的「读者在哪里」机制里：在页面的滚动条带上按下鼠标开始拖动时，把拖动期间的每次 scroll 都当作读者发起的（并放开此前点击留下的 held、在松手后再续 250ms），让页面跟着滑块走而不是被拉回；代码自己写 scrollTop 造成的滚动仍会被拉回。</p>
